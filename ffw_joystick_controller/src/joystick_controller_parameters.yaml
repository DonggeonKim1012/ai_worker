joystick_controller:
  task_vertical_motion:
    type: bool
    default_value: false
    read_only: true
    description: "Opt-in task mapping: left vertical drives forward/back, right vertical jogs SH5 lift; no head, lateral or yaw output."
  task_base_speed:
    type: double
    default_value: 0.1
    read_only: true
    validation:
      bounds<>: [0.0, 0.2]
  task_lift_speed:
    type: double
    default_value: 0.03
    read_only: true
    validation:
      bounds<>: [0.0, 0.05]
  allow_task_final_pose: {
    type: bool,
    default_value: false,
    description: "Opt-in SH5 only: reserve joystick axes when the follower enables a task final pose.",
    read_only: true
  }
  final_pose_gesture_enabled: {
    type: bool,
    default_value: false,
    description: "Publish raw normalized joystick values for final pose gestures without jogging head, lift, or base.",
    read_only: true
  }
  joystick_sensors: {
    type: string_array,
    default_value: [],
    description: "Joystick sensor names to read from",
    read_only: true,
    validation: {
      unique<>: null,
    }
  }
  state_interfaces: {
    type: string_array,
    default_value: ["JOYSTICK X VALUE", "JOYSTICK Y VALUE", "JOYSTICK TACT SWITCH"],
    description: "State interfaces provided by the hardware for Joystick sensors",
    read_only: true,
  }
  sensorxel_l_joy_reverse_interfaces: {
    type: string_array,
    default_value: [],
    description: "List of state interfaces to reverse after normalization",
    read_only: true,
  }
  sensorxel_r_joy_reverse_interfaces: {
    type: string_array,
    default_value: [],
    description: "List of state interfaces to reverse after normalization",
    read_only: true,
  }
  joystick_calibration_min: {
    type: double,
    default_value: 0.0,
    description: "Minimum ADC value (0)",
    read_only: true
  }
  joystick_calibration_center: {
    type: double,
    default_value: 2048.0,
    description: "Center ADC value (2048)",
    read_only: true
  }
  joystick_calibration_max: {
    type: double,
    default_value: 4096.0,
    description: "Maximum ADC value (4096)",
    read_only: true
  }
  sensorxel_l_joy_controlled_joints: {
    type: string_array,
    default_value: [],
    description: "List of joints to control with Joystick",
    read_only: true
  }
  sensorxel_r_joy_controlled_joints: {
    type: string_array,
    default_value: [],
    description: "List of joints to control with Joystick",
    read_only: true
  }
  joint_states_topic: {
    type: string,
    default_value: "/joint_states",
    description: "Topic to subscribe for joint states",
    read_only: true
  }
  sensorxel_l_joy_joint_trajectory_topic: {
    type: string,
    default_value: "~/joint_trajectory",
    description: "Topic to publish joint trajectory commands",
    read_only: true
  }
  sensorxel_r_joy_joint_trajectory_topic: {
    type: string,
    default_value: "~/joint_trajectory",
    description: "Topic to publish joint trajectory commands",
    read_only: true
  }
  sensorxel_l_joy_joint_states_stamped_topic: {
    type: string,
    default_value: "",
    description: "Topic to publish stamped joint states for the left joystick. If empty, derive from the joint trajectory topic.",
    read_only: true
  }
  sensorxel_r_joy_joint_states_stamped_topic: {
    type: string,
    default_value: "",
    description: "Topic to publish stamped joint states for the right joystick. If empty, derive from the joint trajectory topic.",
    read_only: true
  }
  sensorxel_l_joy_jog_scale: {
    type: double,
    default_value: 0.1,
    description: "Scale factor for jog commands",
    read_only: true
  }
  sensorxel_r_joy_jog_scale: {
    type: double,
    default_value: 0.1,
    description: "Scale factor for jog commands",
    read_only: true
  }
  deadzone: {
    type: double,
    default_value: 0.05,
    description: "Deadzone around center position (0.0 to 1.0)",
    read_only: true
  }
  long_press_duration: {
    type: double,
    default_value: 0.5,
    description: "Duration in seconds to trigger long press event",
    read_only: true
  }
  enable_randomization: {
    type: bool,
    default_value: false,
    description: "Enable random offsets on recording finish events",
    read_only: false
  }
  action_event_topic: {
    type: string,
    default_value: "/task/action_event",
    description: "Topic to receive recording action events",
    read_only: true
  }
  head_random_range: {
    type: double_array,
    default_value: [-0.00, 0.00],
    description: "Head joint random offset range",
    read_only: true
  }
  lift_random_range: {
    type: double_array,
    default_value: [-0.02, 0.02],
    description: "Lift joint random offset range",
    read_only: true
  }
  cmd_vel_linear_x_random_range: {
    type: double_array,
    default_value: [-0.05, 0.05],
    description: "cmd_vel linear.x random offset range",
    read_only: true
  }
  cmd_vel_linear_y_random_range: {
    type: double_array,
    default_value: [-0.1, 0.1],
    description: "cmd_vel linear.y random offset range",
    read_only: true
  }
  cmd_vel_angular_z_random_range: {
    type: double_array,
    default_value: [-0.1, 0.1],
    description: "cmd_vel angular.z random offset range",
    read_only: true
  }
  random_duration: {
    type: double,
    default_value: 1.0,
    description: "Seconds to interpolate joint offsets and pulse cmd_vel offsets",
    read_only: true
  }
  up_save_pose_id:
    type: int
    default_value: 0
    read_only: true
    description: "0 disables gestures; 3..255 sends per-arm save pose on the configured stick axis"
    validation:
      bounds<>: [0, 255]
  save_pose_axis_index:
    type: int
    default_value: 0
    read_only: true
    description: "Joystick axis for save-pose gesture: 0=X (vertical), 1=Y (horizontal)"
    validation:
      bounds<>: [0, 1]
  left_save_pose_deadzone:
    type: double
    default_value: -1.0
    read_only: true
    description: "Left save-pose axis deadzone; negative uses the ordinary deadzone"
    validation:
      bounds<>: [-1.0, 0.99]
  right_save_pose_deadzone:
    type: double
    default_value: 0.9
    read_only: true
    description: "Deadzone for the right save-pose gesture axis only"
    validation:
      bounds<>: [0.0, 0.99]
  up_axis_sign:
    type: double
    default_value: 1.0
    read_only: true
    description: "Sign of the selected normalized gesture axis (+1 or -1)"
    validation:
      one_of<>: [[-1.0, 1.0]]
